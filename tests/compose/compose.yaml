services:
  checkmk:
    image: checkmk/check-mk-community:2.5.0p14@sha256:940b52a6983b61c64c217ebee81f62a41011850e2873ef8d8fa1c1af1bea40f5
    platform: linux/amd64
    environment:
      CMK_SITE_ID: cmk
      # Public dummy password for local development only. Never use in production.
      CMK_PASSWORD: localdev
      TZ: Europe/Rome
    ports:
      - "127.0.0.1:8080:5000"
    volumes:
      - checkmk-sites:/omd/sites
      - ../..:/workspace:ro
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:5000/cmk/check_mk/login.py"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

volumes:
  checkmk-sites:
